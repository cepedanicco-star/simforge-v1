[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ue-isaac-pipeline"
version = "1.0.0"
description = "Source-only UE to Isaac workflow with explicit physical acceptance gates"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT AND Apache-2.0"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<1.16", "Pillow>=11,<13", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.scripts]
simforge = "pipeline.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "pipeline/native"]
addopts = "-p no:cacheprovider"
